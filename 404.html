<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — DOCK50</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    @font-face { font-family: "Special Gothic Expanded One"; src: url("/fonts/SpecialGothicExpandedOne-Regular.woff2") format("woff2"), url("/fonts/SpecialGothicExpandedOne-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Geist Mono"; src: url("/fonts/GeistMono-Light.woff2") format("woff2"), url("/fonts/GeistMono-Light.ttf") format("truetype"); font-weight: 300; font-display: swap; }
    @font-face { font-family: "Geist Mono"; src: url("/fonts/GeistMono-Regular.woff2") format("woff2"), url("/fonts/GeistMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Geist Mono"; src: url("/fonts/GeistMono-Medium.woff2") format("woff2"), url("/fonts/GeistMono-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:   #0e0e0e;
      --text: #ffffff;
      --dim:  rgba(255,255,255,0.35);
      --line: rgba(255,255,255,0.10);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: "Geist Mono", monospace;
      height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      text-align: center;
    }

    .logo img {
      height: clamp(14px, 2.2vh, 20px);
      width: auto;
      opacity: 0.6;
    }

    .num {
      font-family: "Special Gothic Expanded One", sans-serif;
      font-size: clamp(6rem, 20vw, 14rem);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.15);
      user-select: none;
    }

    .message {
      font-size: clamp(0.68rem, 1.4vw, 0.82rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
      font-size: clamp(0.65rem, 1.3vw, 0.76rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      padding: 0.8em 1.8em;
      transition: border-color 0.2s, color 0.2s;
    }

    .back:hover {
      border-color: rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>

  <a href="/" class="logo">
    <img src="/logo-dock50.png" alt="DOCK50" />
  </a>

  <p class="num">404</p>

  <p class="message">Diese Seite existiert nicht</p>

  <a href="/" class="back">← Zurück zur Startseite</a>

  <footer style="position:absolute;bottom:2rem;left:0;right:0;text-align:center;font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.25)">
    <a href="/impressum.html" style="color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.15)">Impressum</a> · <a href="/datenschutz.html" style="color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.15)">Datenschutz</a>
  </footer>

</body>
</html>
